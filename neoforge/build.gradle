plugins {
    id 'multiloader-loader'
    id 'idea'
    id 'net.neoforged.moddev'
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Separate directory, so a dedicated server can run next to the dev client.
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Own directory: in run/ it would share the folder with the dev client.
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', providers.gradleProperty('meals').isPresent() ? 'handson_meals'
                    : providers.gradleProperty('extradelight').isPresent() ? 'handson_extradelight' : project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dependencies added to localRuntime are available in dev runs but are not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // NeoForge mods are published in Mojang names: they run in the development environment as they are, mixins included.
    implementation "maven.modrinth:farmers-delight:${farmers_delight_version}"
    implementation "com.pockyl.diegesis:neoforge:${diegesis_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    // Miner's Delight's copper pot is a station when that mod is there: mixins into it, compiled against it only.
    compileOnly "maven.modrinth:miners-delight:${miners_delight_version}"
    // Brewin' and Chewin's keg is a station too: compiled against it only.
    compileOnly "maven.modrinth:brewin-and-chewin:${brewin_and_chewin_version}"
    // Chopper's Delight's decorated board is a board station too: compiled against it only.
    compileOnly "maven.modrinth:choppers-delight:${choppers_delight_version}"
    // Cultural Delights' oven is a station too: compiled against it only.
    compileOnly "maven.modrinth:cultural-delights:${cultural_delights_version}"
    // Dungeons Delight's monster pot is a station too: compiled against it only.
    compileOnly "maven.modrinth:dungeons_delight:${dungeons_delight_version}"
    // Farmer's Respite's kettle (its unofficial NeoForge port) is a station too: compiled against it only.
    compileOnly "maven.modrinth:farmers-respite-unofficial-port:${farmers_respite_version}"
    // Farmer's Spell's alchemist pot is a station too, its scroll an Iron's Spells scroll: compiled against both only.
    compileOnly "maven.modrinth:farmers-spell:${farmers_spell_version}"
    compileOnly "maven.modrinth:irons-spells-n-spellbooks:${irons_spellbooks_version}"
    // Youkai's Feasts' kettle, cuisine board and pots are stations too: compiled against it only (its drinks; its blocks are reached
    // by name, as their classes build on the L2 libraries nested in its jar).
    compileOnly "maven.modrinth:gensokyo-delight-youkais-feasts:${youkais_feasts_version}"
    // Extra Delight's mixing bowl is a station too: compiled against it only.
    // Extra Delight's vat is a station too: compiled against it only.
    // Extra Delight's melting pot is a station too: compiled against it only.
    compileOnly "maven.modrinth:extradelight:${extra_delight_version}"
}

// -Pmeals runs only the game tests of Modest Meals' meals at the board, with Modest Meals: it makes Farmer's Delight's burgers,
// salads, pies and soups as its meals, so the other tests that make those would fail by design. Its tests and their template
// are in src/meals, under a game test namespace of their own.
var meals = providers.gradleProperty('meals').isPresent()
if (meals) {
    dependencies {
        [
                'modest-meals:j08xLlyV',          // Modest Meals 3.0.0+1.21.1
                'yacl:7TVdVtxF',                  // YetAnotherConfigLib, needed by Modest Meals
        ].each { localRuntime "maven.modrinth:${it}" }
    }
    sourceSets.main.java.srcDir 'src/meals/java'
    sourceSets.main.resources.srcDir 'src/meals/resources'
}

// -Pextradelight runs only the game tests of Extra Delight's stations, with Extra Delight: it overrides Farmer's Delight's stews,
// cocoa, pies and dough and adds pot recipes of the same food (stir-fry), so 20 other tests fail with it by design. Its tests and
// their template are in src/extradelight, under a game test namespace of their own. It goes with -Paddons=wide too.
var extraDelight = providers.gradleProperty('extradelight').isPresent()
if (extraDelight) {
    dependencies {
        localRuntime "maven.modrinth:extradelight:${extra_delight_version}" // Extra Delight 2.7.1
    }
    sourceSets.main.java.srcDir 'src/extradelight/java'
    sourceSets.main.resources.srcDir 'src/extradelight/resources'
}

// -Paddons runs the game and the game tests with the most downloaded Farmer's Delight addons that have a NeoForge 1.21.1 build
// (Modrinth version ids), so that the mod is tested with them as well as without. Delightful and Nether's Delight have none; Farmer's
// Respite has an unofficial port.
if (providers.gradleProperty('addons').isPresent()) {
    dependencies {
        [
                'ends-delight:YTApg6Hl',          // End's Delight 2.6.1+neoforge.1.21.1
                'oceans-delight:ja5Qg1xw',        // Ocean's Delight 1.0.4
                'chefs-delight:N8hZwT7r',         // Chef's Delight 1.0.6-neoforge-1.21.1
                'enders-delight:5S67w5gs',        // Ender's Delight 1.3.1
                'my-nethers-delight:SGFJBL5q',    // My Nether's Delight 1.10.4.1
                'more-delight:DpW4EgJo',          // More Delight 26.05.20a-1.21-neoforge
                'delight-lib:wCR4QGbG',           // Delight Lib 26.05.18-1.21-neoforge, needed by More Delight
                'autochefs-delight:ENpbCFK1',     // Autochef's Delight 2.0.3+neoforge
                "brewin-and-chewin:${brewin_and_chewin_version}", // Brewin' And Chewin' 4.5.0+1.21.1-neoforge
                "miners-delight:${miners_delight_version}", // Miner's Delight 1.4.5
                'lodestonelib:CohX6yP1',          // Lodestone 1.8.2, needed by Miner's Delight
                'frights-delight:4BABsmeb',       // Fright's Delight 1.4.8: a bone cut into the skewers its kebabs are served on
                "dungeons_delight:${dungeons_delight_version}", // Dungeons Delight 1.21.1-1.5.2
                'runiclib:tk5EQpUG',              // RunicLib 5.0.7, needed by Dungeons Delight
                "choppers-delight:${choppers_delight_version}",      // Chopper's Delight 1.2.2: cutting boards of every wood, Farmer's Delight's own block
                "farmers-respite-unofficial-port:${farmers_respite_version}", // Farmer's Respite Unofficial Port 3.0.1: its kettle
        ].each { localRuntime "maven.modrinth:${it}" }
        // -Paddons=wide adds the next most downloaded addons that need no other mods: more food, own crafts and tags. Vintage
        // Delight, in the 1.20.1 list, has no NeoForge 1.21.1 build.
        if (providers.gradleProperty('addons').get() == 'wide') {
            [
                    'rustic-delight:sAaG4pSA',        // Rustic Delight 1.7.1
                    'ubes-delight:hxl0dMZ3',          // Ube's Delight neoforge-1.21.1-0.4.15
                    'crabbers-delight:j5Nzh8kh',      // Crabber's Delight 1.3.1
                    "cultural-delights:${cultural_delights_version}", // Cultural Delights 0.19.8-1.21.1
                    'barbeques-delight-forge:rvUhMw6d', // Barbeque's Delight 1.3.0
                    'festive-delight:FP8ZwEus',       // Festive Delight 2.0.0
                    "farmers-spell:${farmers_spell_version}", // Farmer's Spell 'n Spell Book 1.0.7.1: its alchemist pot
                    "irons-spells-n-spellbooks:${irons_spellbooks_version}", // Iron's Spells 'n Spellbooks 1.21.1-3.16.3, needed by it
                    'irons-lib:dgH7P81J',             // Iron's Lib 1.21.1-2.3.0, needed by Iron's Spells
                    'geckolib:Grwn5rUB',              // GeckoLib 4.9.3, needed by Iron's Spells and Farmer's Spell
                    'curios:yohfFbgD',                // Curios API 9.5.1+1.21.1, needed by Iron's Spells
                    'playeranimator:HJZB6bmA',        // playerAnimator 2.0.4+1.21.1, needed by Iron's Spells
                    "gensokyo-delight-youkais-feasts:${youkais_feasts_version}", // Youkai's Feasts 1.1.2: its kettle, board and pots (L2 libraries inside)
            ].each { localRuntime "maven.modrinth:${it}" }
        }
    }
}

// -Pkubejs runs the game tests with KubeJS and a server script listening to its recipe event, so that the board is seen to
// find its dishes when KubeJS changes the recipes.
var kubejs = providers.gradleProperty('kubejs').isPresent()
if (kubejs) {
    dependencies {
        [
                'kubejs:GDXCpKlp',                // KubeJS 2101.7.2-build.381
                'rhino:SqkDvOLG',                 // Rhino 2101.2.8-build.91, needed by KubeJS
                'better-advanced-tooltips:uPFbnD32', // Better Advanced Tooltips 2101.1.0-build.5, needed by KubeJS
                'architectury-api:1IiqEQGl',      // Architectury 13.0.11, for KubeJS
        ].each { localRuntime "maven.modrinth:${it}" }
    }
}
// -Pcrafttweaker runs the game tests with CraftTweaker and a script that removes a Farmer's Delight dish: CraftTweaker runs its scripts
// after the recipe manager has loaded, and the board must lose the dish as well (RecipeEditTests).
var crafttweaker = providers.gradleProperty('crafttweaker').isPresent()
if (crafttweaker) {
    dependencies {
        localRuntime 'maven.modrinth:crafttweaker:BVOSHJwc' // CraftTweaker 21.0.38
    }
}
var prepareKubeJs = tasks.register('prepareKubeJs') {
    var script = project.file('run/gametest/kubejs/server_scripts/handson_delight_test.js')
    var tweak = project.file('run/gametest/scripts/handson_delight_test.zs')
    inputs.property('kubejs', kubejs)
    inputs.property('crafttweaker', crafttweaker)
    doLast {
        if (kubejs) {
            script.parentFile.mkdirs()
            // A modpack's own dish: a script's recipe, brought to the board by tagging its result. A modpack's edits of Farmer's
            // Delight's dishes: an ingredient and a result replaced, a recipe removed and added anew under its id (RecipeEditTests).
            script.text = [
                    "ServerEvents.recipes(event => {",
                    "  event.shapeless('minecraft:mushroom_stew', ['minecraft:bowl', 'minecraft:crimson_fungus', 'minecraft:red_mushroom'])"
                            + ".id('kubejs:fungus_stew')",
                    "  event.replaceInput({id: 'farmersdelight:bacon_sandwich'}, '#c:crops/tomato', 'minecraft:apple')",
                    "  event.replaceOutput({id: 'farmersdelight:egg_sandwich'}, 'farmersdelight:egg_sandwich', "
                            + "'farmersdelight:bacon_sandwich')",
                    "  event.remove({id: 'farmersdelight:chicken_sandwich'})",
                    "  event.shapeless('farmersdelight:chicken_sandwich', ['#c:foods/bread', 'minecraft:cooked_chicken', 'minecraft:apple'])"
                            + ".id('farmersdelight:chicken_sandwich')",
                    "})",
                    "ServerEvents.tags('item', event => event.add('handson_delight:assembled', 'minecraft:mushroom_stew'))"
            ].join(System.lineSeparator()) + System.lineSeparator()
        } else {
            script.delete()
        }
        if (crafttweaker) {
            tweak.parentFile.mkdirs()
            tweak.text = 'craftingTable.removeByName("farmersdelight:chicken_sandwich");' + System.lineSeparator()
        } else {
            tweak.delete()
        }
    }
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn prepareKubeJs }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
            farmers_delight_version_range: farmers_delight_version_range,
            diegesis_version_range : diegesis_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}+${minecraft_version} (NeoForge)"
    modLoaders.add('neoforge')
}
