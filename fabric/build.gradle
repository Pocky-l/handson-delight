plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

// Farmer's Delight Refabricated to compile against, prepared by common (see common/build.gradle). Clients play the
// release jar.
evaluationDependsOn(':common')
def refabricatedForCompile = project(':common').refabricatedForCompile

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnly files(refabricatedForCompile)
    // The API is in Diegesis' common jar, in Mojang names like this project; the Fabric jar of the library plays in
    // the playtest client (playtest-1.21.1-fabric).
    compileOnly "com.pockyl.diegesis:common:${diegesis_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}") {
        exclude group: 'net.fabricmc'
        exclude group: 'net.fabricmc.fabric-api'
    }
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            configName = 'Fabric Client'
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            configName = 'Fabric Server'
            ideConfigGenerated(true)
            runDir('run-server')
        }
    }
}

configurations {
    gameTestMods { transitive = false }
}

dependencies {
    gameTestMods "maven.modrinth:farmers-delight-refabricated:${farmers_delight_refabricated_version}"
    gameTestMods "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Not in the fabric-api jar: the module that runs the tests (the version fabric-api's POM names).
    gameTestMods 'net.fabricmc.fabric-api:fabric-gametest-api-v1:2.0.5+6fc22b9919'
}

// The game tests of common on a production Fabric server with the release jars: gradlew :fabric:runGameTest. Not a Loom dev
// run: Refabricated 1.21.1 extends enums through its class tweaker, and the loader's runtime remapper of a dev run fails on that.
tasks.register('runGameTest', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    group = 'fabric'
    dependsOn gradle.includedBuild('diegesis').task(':fabric:remapJar')
    mods.from(tasks.named('remapJar'))
    mods.from(configurations.gameTestMods)
    mods.from(file("../../diegesis/fabric/build/libs/diegesis-fabric-${minecraft_version}-${diegesis_version}.jar"))
    installerVersion = '1.1.0'
    jvmArgs.add('-Dfabric-api.gametest')
    runDir = file('run-gametest')
    def eula = file('run-gametest/eula.txt')
    doFirst {
        eula.parentFile.mkdirs()
        eula.text = 'eula=true' + System.lineSeparator()
    }
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_min_version,
            fabric_api_version   : fabric_api_min_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            mod_url              : mod_url,
            farmers_delight_version: farmers_delight_refabricated_min_version,
            diegesis_version     : diegesis_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

publishMods {
    file = tasks.named('remapJar').flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}+${minecraft_version} (Fabric)"
    modLoaders.add('fabric')
}
