org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.103
# The plain Minecraft the common project compiles against (https://projects.neoforged.net/neoforged/neoform).
# Minecraft 26.x ships unobfuscated: no Parchment mappings.
neo_form_version=26.3-1
loader_version_range=[1,)
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players.
fabric_loader_version=0.20.1
fabric_loader_min_version=0.19.5
fabric_api_version=0.166.2+26.3
fabric_api_min_version=0.166.2
# Fabric API modules common compiles against (the versions fabric-api's POM names).
fabric_transfer_api_version=8.0.27+c8357e785d
fabric_api_base_version=2.0.6+fcdff87f5d
fabric_menu_api_version=2.0.31+ed66f0a35d

# Farmer's Delight Refabricated (Modrinth version number). Farmer's Delight on NeoForge has no 26.3 build yet, so common
# compiles against Refabricated too: the classes it uses have the same names and packages on both loaders.
farmers_delight_refabricated_version=26.3-3.6.30
# Refabricated versions read "26.3-3.6.30+refabricated": the Minecraft part must be in the minimum too.
farmers_delight_refabricated_min_version=26.3-3.6.30
# Minecraft 26.3: the compat versions below are for 1.21.1 and are not built (see common/build.gradle). Each comes back once
# the mod has a 26.3 Fabric build.
jei_version=19.8.4.110
emi_version=1.1.24+1.21.1
rei_version=16.0.799
diegesis_version=1.0.0-beta.13
diegesis_version_range=[1.0.0-beta.13,)
# Miner's Delight, compile only: its copper pot is a station too (Modrinth version id of 1.4.5 for NeoForge).
miners_delight_version=YUHbwbgQ
# Brewin' and Chewin', compile only: its keg is a station. Modrinth version ids of 4.5.0+1.21.1 for NeoForge (common compiles
# against it too: the keg's classes are the same on both loaders) and for Fabric.
brewin_and_chewin_version=MbcR48Ou
# Chopper's Delight, compile only: its decorated board is a board station (Modrinth version id of 1.2.2 for NeoForge 1.21.1).
choppers_delight_version=oulg9zE4
brewin_and_chewin_fabric_version=O3PobqCR
# Dungeons Delight, compile only: its monster pot is a station too (Modrinth version id of 1.21.1-1.5.2 for NeoForge).
dungeons_delight_version=ObzSBT2S
cultural_delights_version=LYCtSz7r
# Farmer's Respite, compile only: its kettle is a station (Modrinth version id of its unofficial NeoForge port 3.0.1 for 1.21.1).
farmers_respite_version=aChm7DAW
# Farmer's Spell 'n Spell Book, compile only: its alchemist pot is a station (Modrinth version id of 1.0.7.1-1.21.1 for NeoForge).
farmers_spell_version=4F8DZu21
# Iron's Spells 'n Spellbooks, compile only: the scroll in the alchemist pot (Modrinth version id of 1.21.1-3.16.3).
irons_spellbooks_version=slKLosTb
# Gensokyo Delight: Youkai's Feasts, compile only: its kettle, cuisine board and pots are stations (Modrinth version id of 1.1.2
# for NeoForge 1.21.1).
youkais_feasts_version=nPxyA8G2
# Hearth and Harvest, compile only: its keg and cask are stations (Modrinth version id of 1.4.3 for 1.21.1 NeoForge).
hearth_and_harvest_version=hOEbGYD8
# Extra Delight, compile only: its mixing bowl, vat and melting pot are stations (Modrinth version id of 2.7.1 for NeoForge
# 1.21.1).
extra_delight_version=qoAnW1in
# Sable Trees, compile only: its chopping block is a board station (CurseForge file id of 0.5.1 for NeoForge 1.21.1, the
# only loader it has; Curse Maven).
sable_trees_version=9474179

## Mod
mod_id=handson_delight
mod_name=Hands-On Delight
mod_version=1.6.0
mod_group_id=com.pockyl.handson_delight
mod_license=MIT
mod_authors=Pocky
mod_description=Cook in Farmer's Delight with your hands: its menus become interactive in-world stations.
mod_url=https://github.com/Pocky-l/handson-delight

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1790221
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs; curseforge_requires_<loader> replaces the list for that loader.
curseforge_requires=diegesis
curseforge_requires_neoforge=farmers-delight,diegesis
curseforge_requires_fabric=farmers-delight-refabricated,diegesis,fabric-api
# Minecraft 26.3: the recipe viewers are not built (common/build.gradle), so none is offered.
curseforge_optional=
