org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.253
# The plain Minecraft the common project compiles against (https://projects.neoforged.net/neoforged/neoform).
neo_form_version=1.21.1-20240808.144430
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players.
# Farmer's Delight Refabricated 1.21.1 needs loader 0.19 or newer to run.
fabric_loader_version=0.19.5
fabric_loader_min_version=0.16.1
fabric_api_version=0.116.17+1.21.1
# Refabricated 3.3.6 declares any Fabric API but fails to start below 0.116.2 (NoSuchMethodError on addAlias): ask for
# 0.116.2, so the loader names what to update instead of Farmer's Delight crashing.
fabric_api_min_version=0.116.2

# Farmer's Delight: the NeoForge mod, and Farmer's Delight Refabricated on Fabric (same mod id and packages, own
# inventory classes: see platform.Platform). Modrinth version numbers.
farmers_delight_version=1.21.1-1.3.4
# Farmer's Delight on NeoForge names its version without the Minecraft part.
farmers_delight_version_range=[1.3.4,)
farmers_delight_refabricated_version=1.21.1-3.3.6
# Refabricated versions read "1.21.1-3.3.6+refabricated": the Minecraft part must be in the minimum too.
farmers_delight_refabricated_min_version=1.21.1-3.3.6
# Recipe viewers, compile only: the sandwiches show as put together on the cutting board.
# JEI: the oldest API for 1.21.1 on purpose, so a call that older JEI builds lack (still in many modpacks) fails the
# build instead of crashing the game when the category opens.
jei_version=19.8.4.110
emi_version=1.1.24+1.21.1
rei_version=16.0.799
diegesis_version=1.0.0-beta.8
diegesis_version_range=[1.0.0-beta.8,)
# Miner's Delight, compile only: its copper pot is a station too (Modrinth version id of 1.4.5 for NeoForge).
miners_delight_version=YUHbwbgQ
# Brewin' and Chewin', compile only: its keg is a station. Modrinth version ids of 4.5.0+1.21.1 for NeoForge (common compiles
# against it too: the keg's classes are the same on both loaders) and for Fabric.
brewin_and_chewin_version=MbcR48Ou
brewin_and_chewin_fabric_version=O3PobqCR
# Dungeons Delight, compile only: its monster pot is a station too (Modrinth version id of 1.21.1-1.5.2 for NeoForge).
dungeons_delight_version=ObzSBT2S

## Mod
mod_id=handson_delight
mod_name=Hands-On Delight
mod_version=1.4.1
mod_group_id=com.pockyl.handson_delight
mod_license=MIT
mod_authors=Pocky
mod_description=Cook in Farmer's Delight with your hands: its menus become interactive in-world stations.
mod_url=https://github.com/Pocky-l/handson-delight

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1790221
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs; curseforge_requires_<loader> replaces the list for that loader.
curseforge_requires=diegesis
curseforge_requires_neoforge=farmers-delight,diegesis
curseforge_requires_fabric=farmers-delight-refabricated,diegesis,fabric-api
curseforge_optional=jei,emi,roughly-enough-items
