// The stations, scenes and assets shared by NeoForge and Fabric, compiled against plain Minecraft, the Diegesis API and
// Farmer's Delight. Nothing here may use a loader API or a member of Farmer's Delight whose type differs between its
// NeoForge and Fabric builds (the inventory, the recipe wrapper, the registry holders): those go through platform.Platform.
plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
}

// Minecraft 26.3: the recipe viewers and most addon mods have no 26.3 Fabric builds yet, so what compiles against them is
// left out of the build (the sources stay). The loader projects leave out the same files. The addon mixins are also left out
// of handson_delight.mixins.json; the rest of the addon support finds the addons at runtime and stays dormant without them.
// Cultural Delights has one: the mixins of its oven and vat are built against it.
ext.compatSources = [
        'com/pockyl/handson_delight/compat/jei/**',
        'com/pockyl/handson_delight/compat/emi/**',
        'com/pockyl/handson_delight/mixin/CfbOvenToolsMixin.java',
        'com/pockyl/handson_delight/mixin/CfbOvenTopMixin.java',
        'com/pockyl/handson_delight/mixin/DecoratedBoardContentMixin.java',
        'com/pockyl/handson_delight/mixin/DecoratedBoardMixin.java',
        'com/pockyl/handson_delight/mixin/KegMixin.java',
]
sourceSets.main.java.exclude(compatSources)

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.5'
    // The mixin plugin's interface names ASM's class node; the loaders bring ASM at runtime.
    compileOnly 'org.ow2.asm:asm-tree:9.5'
    compileOnly "com.pockyl.diegesis:common:${diegesis_version}"
    // Farmer's Delight on NeoForge has no 26.3 build: Refabricated stands for both. 26.x is unobfuscated, so its jar is in
    // Mojang names like this project.
    compileOnly("maven.modrinth:farmers-delight-refabricated:${farmers_delight_refabricated_version}") { transitive = false }
    // Refabricated's block entities name Fabric's transfer and menu APIs in their signatures: javac needs them to read them.
    compileOnly("net.fabricmc.fabric-api:fabric-transfer-api-v1:${fabric_transfer_api_version}") { transitive = false }
    compileOnly("net.fabricmc.fabric-api:fabric-api-base:${fabric_api_base_version}") { transitive = false }
    // Its cooking pot is an extended menu provider of Fabric's menu API, which the game tests read it as.
    compileOnly("net.fabricmc.fabric-api:fabric-menu-api-v1:${fabric_menu_api_version}") { transitive = false }
    // Cultural Delights' oven and vat are stations: their block entities send their content to clients through mixins compiled
    // against its 26.3 Fabric build.
    compileOnly("maven.modrinth:cultural-delights:${cultural_delights_fabric_version}") { transitive = false }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Fabric'
                url = 'https://maven.fabricmc.net/'
            }
        }
        filter { includeGroup('net.fabricmc.fabric-api') }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
