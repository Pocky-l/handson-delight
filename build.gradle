plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('src/generated/**/.cache')
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Separate directory, so a dedicated server can run next to the dev client.
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Own directory, with Diegesis in its mods folder (see syncDevMods).
            gameDirectory = project.file('run/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dependencies added to localRuntime are available in dev runs but are not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

configurations {
    // Diegesis is a mod with mixins from an included build: it runs from a mods folder, as in the playtest client.
    devMods {
        canBeConsumed = false
        transitive = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
}

dependencies {
    // Published mods use SRG names; the mod* configurations remap them to the development mappings.
    modImplementation "maven.modrinth:farmers-delight:${farmers_delight_version}"
    compileOnly "com.pockyl.diegesis:forge:${diegesis_version}"
    devMods "com.pockyl.diegesis:forge:${diegesis_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

var syncDevMods = tasks.register('syncDevMods', Sync) {
    from(configurations.devMods)
    into 'run/gametest/mods'
}

// Forge 1.20.1 runs the game tests on a dedicated server, in a world made from server.properties: a flat one.
var prepareGameTestServer = tasks.register('prepareGameTestServer') {
    var dir = project.file('run/gametest')
    outputs.file(new File(dir, 'server.properties'))
    doLast {
        dir.mkdirs()
        new File(dir, 'server.properties').text = [
                'level-type=minecraft:flat', 'generate-structures=false', 'spawn-protection=0'
        ].join(System.lineSeparator()) + System.lineSeparator()
    }
}
tasks.named('runGameTestServer') { dependsOn syncDevMods, prepareGameTestServer }

// Refmaps translate the mixin targets to the SRG names Forge uses at runtime.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
            farmers_delight_version_range: farmers_delight_version_range,
            diegesis_version_range : diegesis_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    def licenseName = "LICENSE_${mod_id}"
    from('LICENSE') {
        rename { licenseName }
    }
    manifest.attributes(
            // Forge 47 reads mixin configs from the manifest, not from mods.toml.
            'MixinConfigs': "${mod_id}.mixins.json",
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors,
    )
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------------------
// Release
// ---------------------------------------------------------------------------

// Returns the body of the "## [version]" section of CHANGELOG.md, or null when it is missing.
static String extractChangelog(String changelog, String version) {
    def lines = changelog.readLines()
    def start = lines.findIndexOf { it ==~ /^##\s+\[?${java.util.regex.Pattern.quote(version)}\]?(\s.*)?$/ }
    if (start < 0) {
        return null
    }
    def end = lines.findIndexOf(start + 1) { it.startsWith('## ') }
    def body = lines.subList(start + 1, end < 0 ? lines.size() : end).join('\n').trim()
    return body ?: null
}

// Releases of this branch are versioned "<mod_version>+<minecraft_version>" in the changelog and on CurseForge.
def releaseVersion = "${mod_version}+${minecraft_version}"
def releaseNotes = extractChangelog(
        providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.getOrElse(''),
        releaseVersion)
def curseforgeToken = providers.gradleProperty('curseforge_token')
        .orElse(providers.environmentVariable('CURSEFORGE_TOKEN'))

// Validates release metadata and writes the notes of the current version to build/release-notes.md.
var releaseNotesTask = tasks.register('releaseNotes') {
    group = 'publishing'
    description = 'Validates release metadata and writes notes for the current version.'

    def notes = releaseNotes
    def version = releaseVersion
    def projectId = curseforge_project_id
    def output = layout.buildDirectory.file('release-notes.md')
    inputs.property('notes', notes ?: '')
    inputs.property('projectId', projectId)
    outputs.file(output)

    doLast {
        if (!notes) {
            throw new GradleException("CHANGELOG.md has no non-empty section for version ${version}")
        }
        if (!(projectId ==~ /\d+/)) {
            throw new GradleException('curseforge_project_id is not set in gradle.properties')
        }
        output.get().asFile.text = notes + '\n'
    }
}

publishMods {
    // The reobfuscated (SRG) jar is the one that runs outside the development environment.
    file = tasks.named('reobfJar', Jar).flatMap { it.archiveFile }
    changelog = releaseNotes ?: ''
    // A mod_version like 1.0.0-beta.1 or 1.0.0-alpha.1 goes out as a beta or alpha file.
    type = mod_version.contains('-alpha') ? ALPHA : mod_version.contains('-beta') ? BETA : STABLE
    displayName = "${mod_name} ${releaseVersion}"
    modLoaders.add('forge')
    dryRun = providers.gradleProperty('dryRun').map { it != 'false' }.orElse(false)

    curseforge {
        projectId = curseforge_project_id
        accessToken = curseforgeToken
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_17)
        client = curseforge_client.toBoolean()
        server = curseforge_server.toBoolean()
        curseforge_requires.split(',')*.trim().findAll().each { requires(it) }
        curseforge_optional.split(',')*.trim().findAll().each { optional(it) }
    }
}

tasks.named('publishCurseforge') {
    dependsOn releaseNotesTask
}
