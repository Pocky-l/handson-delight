// Shared by common, neoforge and fabric: Java version, repositories, jar naming and contents.
plugins {
    id 'java-library'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    // Farmer's Delight (NeoForge) and Farmer's Delight Refabricated (Fabric).
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
    // Recipe viewers: JEI, EMI, and REI with the libraries its API needs.
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared (JEI)'
                url = 'https://maven.blamejared.com/'
            }
        }
        filter { includeGroup('mezz.jei') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraformersMC (EMI)'
                url = 'https://maven.terraformersmc.com/releases/'
            }
        }
        filter { includeGroup('dev.emi') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'Shedaniel (REI)'
                    url = 'https://maven.shedaniel.me/'
                },
                maven {
                    name = 'Architectury'
                    url = 'https://maven.architectury.dev/'
                }
        )
        filter {
            includeGroupAndSubgroups('me.shedaniel')
            includeGroup('dev.architectury')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    def licenseName = "LICENSE_${mod_id}"
    from(rootProject.file('LICENSE')) {
        rename { licenseName }
    }
    manifest.attributes(
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors,
    )
}
