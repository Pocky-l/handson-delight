org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=47.4.26
# The lowest Forge (and NeoForge 1.20.1) version the mod accepts.
forge_version_range=[47,)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# Fabric: the versions to build with; the *_min_version ones are what fabric.mod.json asks of players.
# Farmer's Delight Refabricated needs loader 0.18.2 or newer.
fabric_loader_version=0.19.2
fabric_loader_min_version=0.15.0
fabric_api_version=0.92.12+1.20.1
fabric_api_min_version=0.92.0

# Farmer's Delight: the Forge mod, and Farmer's Delight Refabricated on Fabric (same mod id and packages, own
# inventory classes: see platform.Platform). Modrinth version numbers.
farmers_delight_version=1.20.1-1.3.4
# From 1.3.1 FD carries MixinExtras, which the mixins use; the FD API used here is the same from 1.3.0 and 2.5.0 on (javap).
farmers_delight_version_range=[1.20.1-1.3.1,)
farmers_delight_refabricated_version=1.20.1-2.5.7
# Refabricated versions read "1.20.1-2.5.0+refabricated": the Minecraft part must be in the minimum too.
farmers_delight_refabricated_min_version=1.20.1-2.5.0
# Recipe viewers, compile only: the sandwiches show as put together on the cutting board.
# JEI: an old API on purpose, so a call that older JEI builds lack (still in many modpacks) fails the build instead of
# crashing the game when the category opens.
jei_version=15.2.0.27
emi_version=1.1.24+1.20.1
rei_version=12.1.785
diegesis_version=1.0.0-beta.8
diegesis_version_range=[1.0.0-beta.8,)

## Mod
mod_id=handson_delight
mod_name=Hands-On Delight
mod_version=1.4.0
mod_group_id=com.pockyl.handson_delight
mod_license=MIT
mod_authors=Pocky
mod_description=Cook in Farmer's Delight with your hands: its menus become interactive in-world stations.
mod_url=https://github.com/Pocky-l/handson-delight

## CurseForge
# Numeric project ID from the CurseForge project page ("About Project" sidebar).
curseforge_project_id=1790221
curseforge_client=true
curseforge_server=true
# Comma-separated CurseForge project slugs; curseforge_requires_<loader> replaces the list for that loader.
curseforge_requires=diegesis
curseforge_requires_forge=farmers-delight,diegesis
curseforge_requires_fabric=farmers-delight-refabricated,diegesis,fabric-api
curseforge_optional=jei,emi,roughly-enough-items
