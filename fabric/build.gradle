plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

// Minecraft 26.x is unobfuscated: no mappings and no remapping, so mods are plain implementation dependencies and the jar
// task builds the release file.
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly("maven.modrinth:farmers-delight-refabricated:${farmers_delight_refabricated_version}") { transitive = false }
    compileOnly("maven.modrinth:cultural-delights:${cultural_delights_fabric_version}") { transitive = false }
    compileOnly("maven.modrinth:choppers-delight:${choppers_delight_fabric_version}") { transitive = false }
    // The API is in Diegesis' common jar; the Fabric jar of the library plays in the game.
    compileOnly "com.pockyl.diegesis:common:${diegesis_version}"
}

// The compat sources common leaves out (see common/build.gradle), and the REI plugin with them.
evaluationDependsOn(':common')
def compatSources = project(':common').compatSources
tasks.named('compileJava', JavaCompile) {
    exclude(compatSources)
    exclude('com/pockyl/handson_delight/fabric/rei/**')
}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            configName = 'Fabric Client'
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            configName = 'Fabric Server'
            ideConfigGenerated(true)
            runDir('run-server')
        }
    }
}

configurations {
    gameTestMods { transitive = false }
}

dependencies {
    gameTestMods "maven.modrinth:farmers-delight-refabricated:${farmers_delight_refabricated_version}"
    gameTestMods "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // Not in the fabric-api jar: the module that runs the tests (the version fabric-api's POM names).
    gameTestMods 'net.fabricmc.fabric-api:fabric-gametest-api-v1:4.0.18+867b87624c'
    // -Paddons: the addons with a 26.1.2 Fabric build whose stations open: Cultural Delights' oven and vat, Chopper's Delight's
    // boards.
    if (providers.gradleProperty('addons').isPresent()) {
        gameTestMods "maven.modrinth:cultural-delights:${cultural_delights_fabric_version}"
        gameTestMods "maven.modrinth:choppers-delight:${choppers_delight_fabric_version}"
    }
    // -Ppolymer: Polymer, which changes items and ingredients as a player's connection writes them (the recipes sent to clients).
    if (providers.gradleProperty('polymer').isPresent()) {
        gameTestMods "maven.modrinth:polymer:${polymer_version}"
    }
}

tasks.register('runGameTest', net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    group = 'fabric'
    dependsOn gradle.includedBuild('diegesis').task(':fabric:jar')
    mods.from(tasks.named('jar'))
    mods.from(configurations.gameTestMods)
    mods.from(file("../../diegesis/fabric/build/libs/diegesis-fabric-${minecraft_version}-${diegesis_version}.jar"))
    installerVersion = '1.1.0'
    jvmArgs.add('-Dfabric-api.gametest')
    runDir = file('run-gametest')
    def eula = file('run-gametest/eula.txt')
    doFirst {
        eula.parentFile.mkdirs()
        eula.text = 'eula=true' + System.lineSeparator()
    }
}

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_min_version,
            fabric_api_version   : fabric_api_min_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description,
            mod_url              : mod_url,
            farmers_delight_version: farmers_delight_refabricated_min_version,
            diegesis_version     : diegesis_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}+${minecraft_version} (Fabric)"
    modLoaders.add('fabric')
}
