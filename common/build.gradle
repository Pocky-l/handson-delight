import java.util.jar.JarFile
import java.util.jar.JarOutputStream
import java.util.jar.Manifest
import java.util.zip.ZipEntry

// The stations, scenes and assets shared by NeoForge and Fabric, compiled against plain Minecraft, the Diegesis API and
// Farmer's Delight. Nothing here may use a loader API or a member of Farmer's Delight whose type differs between its
// NeoForge and Fabric builds (the inventory, the recipe wrapper, the registry holders): those go through platform.Platform.
//
// Minecraft 1.21.11: Farmer's Delight has no NeoForge build, and Refabricated ships in intermediary names. Common is a Loom
// project in Mojang names with Parchment, like the fabric one, so Loom can remap Refabricated for it to compile against.
plugins {
    id 'multiloader-common'
    id 'fabric-loom'
}

// Minecraft 1.21.11: the recipe viewers and most addon mods have no 1.21.11 builds the code is written for, so what compiles
// against them is left out of the build (the sources stay). The loader projects leave out the same files. The addon mixins are
// also left out of handson_delight.mixins.json; the rest of the addon support finds the addons at runtime and stays dormant
// without them. Chopper's Delight has one: the decorated board's mixins are built against it. Cooking for Blockheads' oven
// mixins name its classes only by string.
ext.compatSources = [
        'com/pockyl/handson_delight/compat/jei/**',
        'com/pockyl/handson_delight/compat/emi/**',
        'com/pockyl/handson_delight/mixin/KegMixin.java',
        'com/pockyl/handson_delight/mixin/OvenMixin.java',
        'com/pockyl/handson_delight/mixin/VatMixin.java',
        'com/pockyl/handson_delight/mixin/VatSparksMixin.java',
        'com/pockyl/handson_delight/mixin/VatUprightMixin.java',
]
sourceSets.main.java.exclude(compatSources)

// Farmer's Delight Refabricated 1.21.11 and Chopper's Delight 1.21.11 are built with a newer Loom, and this build's Loom (1.14.10,
// shared by every 1.21.11 Fabric build that playtest-1.21.11-fabric composes: one composite cannot mix Loom versions) refuses
// such jars. Compiling needs only their classes, so a copy without the Loom entries of the manifest is remapped like any other
// mod. Prepared at configuration time, since Loom resolves the mod dependencies while it configures the project.
def forCompile = { String notation, File copy ->
    if (copy.isFile()) {
        return copy
    }
    def release = configurations.detachedConfiguration(dependencies.create(notation))
    release.transitive = false
    copy.parentFile.mkdirs()
    new JarFile(release.singleFile).withCloseable { jar ->
        def manifest = new Manifest(jar.manifest)
        manifest.mainAttributes.keySet().removeIf { it.toString().startsWith('Fabric-Loom-') }
        new JarOutputStream(new FileOutputStream(copy), manifest).withCloseable { out ->
            jar.entries().each { entry ->
                if (entry.name == JarFile.MANIFEST_NAME || entry.name.endsWith('.classtweaker')) {
                    return
                }
                out.putNextEntry(new ZipEntry(entry.name))
                if (entry.name == 'fabric.mod.json') {
                    // Refabricated's class tweaker is format v2, which Loom 1.14 cannot read; the widened members are not used here.
                    def text = jar.getInputStream(entry).getText('UTF-8')
                    out << text.readLines().findAll { !it.contains('"accessWidener"') }.join('\n').getBytes('UTF-8')
                } else {
                    jar.getInputStream(entry).withCloseable { out << it }
                }
                out.closeEntry()
            }
        }
    }
    return copy
}
ext.refabricatedForCompile = forCompile("maven.modrinth:farmers-delight-refabricated:${farmers_delight_refabricated_version}",
        layout.buildDirectory.file("refabricated/farmers-delight-refabricated-${farmers_delight_refabricated_version}.jar").get().asFile)
// Chopper's Delight's decorated board is a board station: its mixins are compiled against its 1.21.11 Fabric build.
ext.choppersForCompile = forCompile("maven.modrinth:choppers-delight:${choppers_delight_fabric_version}",
        layout.buildDirectory.file("choppers/choppers-delight-${choppers_delight_fabric_version}.jar").get().asFile)

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    // Mixin and ASM (the mixin plugin's class node) come with the loader.
    modCompileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly "com.pockyl.diegesis:common:${diegesis_version}"
    modCompileOnly files(refabricatedForCompile)
    modCompileOnly files(choppersForCompile)
    // Refabricated's block entities name Fabric's transfer and menu APIs in their signatures: javac needs them to read them.
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    runConfigs.configureEach {
        ideConfigGenerated = false
    }
}

// Common is no mod of its own: the loader projects build the jars.
tasks.named('remapJar') { enabled = false }

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
