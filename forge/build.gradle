plugins {
    id 'multiloader-loader'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Separate directory, so a dedicated server can run next to the dev client.
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Own directory, with Diegesis in its mods folder (see syncDevMods).
            gameDirectory = project.file('run/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dependencies added to localRuntime are available in dev runs but are not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

configurations {
    // Diegesis is a mod with mixins from an included build: it runs from a mods folder, as in the playtest client.
    devMods {
        canBeConsumed = false
        transitive = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
}

dependencies {
    // Published mods use SRG names; the mod* configurations remap them to the development mappings.
    modImplementation "maven.modrinth:farmers-delight:${farmers_delight_version}"
    compileOnly "com.pockyl.diegesis:forge:${diegesis_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modCompileOnly "dev.emi:emi-forge:${emi_version}:api"
    // Miner's Delight's copper pot is a station when that mod is there: mixins into it, compiled against it only.
    modCompileOnly "maven.modrinth:miners-delight:${miners_delight_version}"
    // Brewin' and Chewin's keg is a station too: compiled against it only.
    modCompileOnly "maven.modrinth:brewin-and-chewin:${brewin_and_chewin_version}"
    // Dungeons Delight's monster pot is a station too: compiled against it only.
    modCompileOnly "maven.modrinth:dungeons_delight:${dungeons_delight_version}"
    // Chopper's Delight's boards are board stations too: compiled against it only.
    modCompileOnly "maven.modrinth:choppers-delight:${choppers_delight_version}"
    // Farmer's Respite's kettle is a station too: compiled against it only.
    modCompileOnly "maven.modrinth:farmers-respite:${farmers_respite_version}"
    // Farmer's Spell's alchemist pot is a station too, its scroll an Iron's Spells scroll: compiled against both only.
    modCompileOnly "maven.modrinth:farmers-spell:${farmers_spell_version}"
    modCompileOnly "maven.modrinth:irons-spells-n-spellbooks:${irons_spellbooks_version}"
    // Youkai's Feasts' kettle is a station too: compiled against it only (its drinks; the kettle itself is reached by name, as its
    // classes build on the L2 libraries nested in its jar).
    modCompileOnly "maven.modrinth:gensokyo-delight-youkais-feasts:${youkais_feasts_version}"
    // Hearth and Harvest's keg is a station too: compiled against it only.
    modCompileOnly "maven.modrinth:hearth-and-harvest:${hearth_and_harvest_version}"
    // Nether's Delight's blackstone stove is a stove station too, on a copy of Farmer's Delight's class: compiled against it only.
    modCompileOnly "maven.modrinth:nethers-delight:${nethers_delight_version}"
    // Vintage Delight's fermenting jar is a keg station too: compiled against it only.
    modCompileOnly "maven.modrinth:vintage-delight:${vintage_delight_version}"
    devMods "com.pockyl.diegesis:forge:${diegesis_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// -Paddons runs the game and the game tests with the most downloaded Farmer's Delight addons (Modrinth version ids), so that the
// mod is tested with them as well as without.
if (providers.gradleProperty('addons').isPresent()) {
    dependencies {
        [
                'ends-delight:FHVQqUkN',          // End's Delight 2.6.1+forge.1.20.1
                'oceans-delight:9jLLNENb',        // Ocean's Delight 1.0.2-1.20
                'chefs-delight:2xW9d8wE',         // Chef's Delight 1.0.5-forge-1.20.1
                'enders-delight:Jaf9wxnO',        // Ender's Delight 1.1.4
                'my-nethers-delight:pOBasFQT',    // My Nether's Delight 1.20.1-1.10.4-backport.1
                'more-delight:GrLDJ8lO',          // More Delight 26.05.20-1.20-forge
                'delight-lib:1lt5savO',           // Delight Lib 26.05.18-1.20-forge, needed by More Delight
                'autochefs-delight:uqjoo6xs',     // Autochef's Delight 1.0.7+forge
                "brewin-and-chewin:${brewin_and_chewin_version}", // Brewin' And Chewin' 1.20.1-3.2.1
                "miners-delight:${miners_delight_version}", // Miner's Delight 1.20.1-1.4.5-backport
                "dungeons_delight:${dungeons_delight_version}", // Dungeons Delight 1.20.1-1.3.2
                'runiclib:DyyjKTPx',              // RunicLib 4.3.11, needed by Dungeons Delight
                "choppers-delight:${choppers_delight_version}", // Chopper's Delight 1.2.3: cutting boards of every wood
                'delightful:HbEQIqIu',            // Delightful 3.8.1-1.20.1
                "nethers-delight:${nethers_delight_version}", // Nether's Delight 1.20.1-4.0: its blackstone stove
                'trailtales-delight:iQKnMv4N',    // Trail&Tales Delight 2.4 for Farmer's Delight 1.3: its mud stove and pottery pot
                "farmers-respite:${farmers_respite_version}", // Farmer's Respite 1.20.1-2.1: its kettle
                'frights-delight:r31i2Fd1',       // Fright's Delight 1.4.8: a bone cut into the skewers its kebabs are served on
                'cooking-for-blockheads:W87tG8sG', // Cooking for Blockheads 16.0.15: its oven
                'balm:dDN38ae7',                  // Balm 7.3.44, needed by Cooking for Blockheads
                "hearth-and-harvest:${hearth_and_harvest_version}", // Hearth and Harvest 1.4.3: its keg
                "vintage-delight:${vintage_delight_version}", // Vintage Delight 0.1.6: its fermenting jar
        ].each { modRuntimeOnly "maven.modrinth:${it}" }
        // -Paddons=wide adds the next most downloaded addons that need no other mods: more food, own crafts and tags.
        if (providers.gradleProperty('addons').get() == 'wide') {
            [
                    'rustic-delight:z29Gd3ec',        // Rustic Delight 1.7.0
                    'ubes-delight:FOEkFTgl',          // Ube's Delight forge-1.20.1-0.4.15
                    'crabbers-delight:9NT9IkSs',      // Crabber's Delight 1.2.3
                    'cultural-delights:mO8IB07o',     // Cultural Delights 0.16.7
                    'barbeques-delight-forge:LsvcmS2n', // Barbeque's Delight 1.0.6
                    'festive-delight:4rjkNzGf',       // Festive Delight 2.0.0
                    "farmers-spell:${farmers_spell_version}", // Farmer's Spell 'n Spell Book 1.0.7: its alchemist pot
                    "irons-spells-n-spellbooks:${irons_spellbooks_version}", // Iron's Spells 'n Spellbooks 1.20.1-3.16.3, needed by it
                    'irons-lib:IptroA3L',             // Iron's Lib 1.20.1-2.3.0, needed by Iron's Spells
                    'geckolib:aC5KMoNg',              // GeckoLib 4.8.4, needed by Iron's Spells
                    'curios:IPQlZkz1',                // Curios API 5.14.1+1.20.1, needed by Iron's Spells
                    'playeranimator:xe2EVE6q',        // playerAnimator 1.0.2-rc1+1.20, needed by Iron's Spells
            ].each { modRuntimeOnly "maven.modrinth:${it}" }
            // Youkai's Feasts 0.5.2: its kitchen (L2 libraries inside). Youkai's Homecoming has the same classes, so never both.
            if (!providers.gradleProperty('homecoming').isPresent()) {
                modRuntimeOnly "maven.modrinth:gensokyo-delight-youkais-feasts:${youkais_feasts_version}"
            }
        }
    }
}

// -Phomecoming runs the game tests with Youkai's Homecoming, the same kitchen as Youkai's Feasts under its own mod id (with
// -Paddons=wide in place of Youkai's Feasts). -Phomecoming=<Modrinth version id> plays an older build, whose stations are left out
// where it lacks what they use.
if (providers.gradleProperty('homecoming').isPresent()) {
    var homecoming = providers.gradleProperty('homecoming').get()
    dependencies {
        modRuntimeOnly "maven.modrinth:youkaishomecoming:${homecoming && homecoming != 'true' ? homecoming : youkais_homecoming_version}"
    }
}

// -Ptwilight runs the game tests with Twilight's Flavor & Delight and the Twilight Forest it needs: its maze stove is a stove station that
// grills the Twilight Forest's food twice as fast. Its own flag, as the Twilight Forest is a whole dimension, not a kitchen addon.
// The Twilight Forest is only on CurseForge, and CurseMaven's POM of this file does not parse in Gradle: its jar comes from
// CurseForge's CDN once, into a Maven layout in the build folder (a flat directory is not remapped).
if (providers.gradleProperty('twilight').isPresent()) {
    var addonRepo = layout.buildDirectory.dir('addon-jars').get().asFile
    var forest = new File(addonRepo, 'local/twilightforest/4.3.2508/twilightforest-4.3.2508.jar')
    if (!forest.exists()) {
        forest.parentFile.mkdirs()
        new URL('https://edge.forgecdn.net/files/5468/648/twilightforest-1.20.1-4.3.2508-universal.jar').withInputStream { input ->
            forest.withOutputStream { it << input }
        }
    }
    repositories {
        maven {
            name = 'AddonJars'
            url = addonRepo
            metadataSources { artifact() }
            content { includeGroup('local') }
        }
    }
    dependencies {
        modRuntimeOnly 'maven.modrinth:twilight-delight:YqN4ZHXo'          // Twilight's Flavor & Delight 2.2.8
        modRuntimeOnly 'local:twilightforest:4.3.2508'                      // The Twilight Forest 4.3.2508 (CurseForge 5468648)
    }
}

// -Pculinary runs the game tests with Culinary Compat, which turns Pam's HarvestCraft crafts that need its cutting board into cuts of
// several things at once on Farmer's Delight's board, made at the board's station too. It does so only with Cooking for Blockheads.
// The rest is the pack of the player who reported it (Discord, 2026-11-16).
var culinary = providers.gradleProperty('culinary').isPresent()
if (culinary) {
    dependencies {
        [
                'culinary-compat:BjWAP4cd',                 // Culinary Compat! 1.1.0
                'cooking-for-blockheads:W87tG8sG',          // Cooking for Blockheads 16.0.15
                'balm:dDN38ae7',                            // Balm 7.3.44, needed by Cooking for Blockheads
                'pams-harvestcraft-2-food-core:RLPfpN1a',   // Pam's HarvestCraft 2: Food Core 1.0.5
                'pams-harvestcraft-2-food-extended:ZHPzQtqH', // Pam's HarvestCraft 2: Food Extended 1.0.1 (filed for 1.20-1.20.4)
        ].each { modRuntimeOnly "maven.modrinth:${it}" }
        [
                'pams-harvestcraft-2-crops-361385:4687624', // Pam's HarvestCraft 2: Crops 1.0.3
                'pams-harvestcraft-2-trees-365460:4625518', // Pam's HarvestCraft 2: Trees 1.0.2
                'croptopia-415438:8066550',                 // Croptopia 4.0.1
                'epherolib-885449:4889101',                 // EpheroLib 1.2.0, needed by Croptopia
        ].each { modRuntimeOnly "curse.maven:${it}" }
    }
}

// -Pkubejs runs the game tests with KubeJS and a server script listening to its recipe event: KubeJS for 1.20.1 then loads the
// recipes itself and cancels the game's own loading, and the board must still find its dishes (KubeJsRecipesMixin). ModernFix
// comes along: most modpacks have it, and it clears the KubeJS event's maps before the mixin reads what it found (GitHub #24).
var kubejs = providers.gradleProperty('kubejs').isPresent()
if (kubejs) {
    dependencies {
        [
                'kubejs:hVR2xUSr',                // KubeJS 2001.6.5-build.26
                'rhino:uNALdylI',                 // Rhino 2001.2.3-build.10, needed by KubeJS
                'architectury-api:1MKTLiiG',      // Architectury 9.2.14, needed by KubeJS
                'modernfix:OM5gX4LT',             // ModernFix 5.27.91
        ].each { modRuntimeOnly "maven.modrinth:${it}" }
    }
}

// -Pcrafttweaker runs the game tests with CraftTweaker and a script that removes a Farmer's Delight dish: CraftTweaker runs its scripts
// after the recipe manager has loaded, and the board must lose the dish as well (RecipeEditTests).
var crafttweaker = providers.gradleProperty('crafttweaker').isPresent()
if (crafttweaker) {
    dependencies {
        modRuntimeOnly 'maven.modrinth:crafttweaker:8GR4gItx' // CraftTweaker 14.0.60
    }
}

var syncDevMods = tasks.register('syncDevMods', Sync) {
    from(configurations.devMods)
    into 'run/gametest/mods'
}

// Forge 1.20.1 runs the game tests on a dedicated server, in a world made from server.properties: a flat one.
var prepareGameTestServer = tasks.register('prepareGameTestServer') {
    var dir = project.file('run/gametest')
    inputs.property('kubejs', kubejs)
    inputs.property('crafttweaker', crafttweaker)
    inputs.property('culinary', culinary)
    outputs.file(new File(dir, 'server.properties'))
    // The world with its datapack is deleted between addon sets: always written anew.
    outputs.upToDateWhen { false }
    doLast {
        dir.mkdirs()
        new File(dir, 'server.properties').text = [
                'level-type=minecraft:flat', 'generate-structures=false', 'spawn-protection=0'
        ].join(System.lineSeparator()) + System.lineSeparator()
        var script = new File(dir, 'kubejs/server_scripts/handson_delight_test.js')
        if (kubejs) {
            script.parentFile.mkdirs()
            // A modpack's own dish: a script's recipe, brought to the board by tagging its result. A modpack's edits of Farmer's
            // Delight's dishes: an ingredient and a result replaced, a recipe removed and added anew under its id (RecipeEditTests).
            script.text = [
                    "ServerEvents.recipes(event => {",
                    "  event.shapeless('minecraft:mushroom_stew', ['minecraft:bowl', 'minecraft:crimson_fungus', 'minecraft:red_mushroom'])"
                            + ".id('kubejs:fungus_stew')",
                    "  event.replaceInput({id: 'farmersdelight:bacon_sandwich'}, '#forge:crops/tomato', 'minecraft:apple')",
                    "  event.replaceOutput({id: 'farmersdelight:egg_sandwich'}, 'farmersdelight:egg_sandwich', "
                            + "'farmersdelight:bacon_sandwich')",
                    "  event.remove({id: 'farmersdelight:chicken_sandwich'})",
                    "  event.shapeless('farmersdelight:chicken_sandwich', ['#forge:bread', 'minecraft:cooked_chicken', 'minecraft:apple'])"
                            + ".id('farmersdelight:chicken_sandwich')",
                    // With -Pculinary: a Pam craft Culinary Compat cuts together, edited before it reads it.
                    "  event.replaceInput({id: 'pamhc2foodcore:caramelyogurtitem'}, '#forge:caramel', 'minecraft:honey_bottle')",
                    // Every other station: a pot meal, a cut, a board dish and a campfire recipe removed; a pot meal and a cut added.
                    // Recipes no other game test uses.
                    "  event.remove({id: 'farmersdelight:cooking/beetroot_soup'})",
                    "  event.remove({id: 'farmersdelight:cutting/allium'})",
                    "  event.remove({id: 'farmersdelight:fruit_salad'})",
                    "  event.remove({id: 'farmersdelight:cooked_cod_slice_from_campfire_cooking'})",
                    "  event.custom({type: 'farmersdelight:cooking', ingredients: [{item: 'minecraft:apple'}, {item: 'minecraft:sugar'}], "
                            + "result: {item: 'minecraft:honey_bottle'}, cookingtime: 100, recipe_book_tab: 'misc'}).id('kubejs:apple_honey')",
                    "  event.custom({type: 'farmersdelight:cutting', ingredients: [{item: 'minecraft:apple'}], "
                            + "tool: {tag: 'forge:tools/knives'}, result: [{item: 'minecraft:stick', count: 2}]}).id('kubejs:apple_sticks')",
                    "})",
                    "ServerEvents.tags('item', event => event.add('handson_delight:assembled', 'minecraft:mushroom_stew'))"
            ].join(System.lineSeparator()) + System.lineSeparator()
        } else {
            script.delete()
        }
        var tweak = new File(dir, 'scripts/handson_delight_test.zs')
        if (crafttweaker) {
            tweak.parentFile.mkdirs()
            tweak.text = ['craftingTable.removeByName("farmersdelight:chicken_sandwich");',
                          // With -Pculinary: a Pam craft Culinary Compat cuts together.
                          'craftingTable.removeByName("pamhc2foodcore:chocolateyogurtitem");'
            ].join(System.lineSeparator()) + System.lineSeparator()
        } else {
            tweak.delete()
        }
        // A modpack's datapack edits Pam's crafts that Culinary Compat cuts together: one changed, one taken out (RecipeEditTests).
        var pack = new File(dir, 'world/datapacks/handson_culinary_test')
        if (culinary) {
            var recipes = new File(pack, 'data/pamhc2foodcore/recipes')
            recipes.mkdirs()
            new File(pack, 'pack.mcmeta').text = '{"pack": {"pack_format": 15, "description": "Hands-On Delight test edits"}}'
            new File(recipes, 'applesauceitem.json').text = '{"type": "minecraft:crafting_shapeless", "ingredients": [' +
                    '{"tag": "forge:tool_cuttingboard"}, {"tag": "forge:crops/apple"}, {"tag": "forge:crops/apple"}, ' +
                    '{"item": "minecraft:honey_bottle"}], "result": {"item": "pamhc2foodcore:applesauceitem"}}'
            new File(recipes, 'appleyogurtitem.json').text = '{"type": "minecraft:crafting_shapeless", ' +
                    '"conditions": [{"type": "forge:false"}], "ingredients": [{"item": "minecraft:apple"}], ' +
                    '"result": {"item": "pamhc2foodcore:appleyogurtitem"}}'
        } else {
            pack.deleteDir()
        }
    }
}
tasks.named('runGameTestServer') { dependsOn syncDevMods, prepareGameTestServer }

// Refmaps translate the mixin targets to the SRG names Forge uses at runtime.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.forge.mixins.json"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
            farmers_delight_version_range: farmers_delight_version_range,
            diegesis_version_range : diegesis_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    // Forge 47 reads mixin configs from the manifest, not from mods.toml.
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json,${mod_id}.forge.mixins.json")
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    // The reobfuscated (SRG) jar is the one that runs outside the development environment.
    file = tasks.named('reobfJar').flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}+${minecraft_version} (Forge)"
    modLoaders.add('forge')
}
