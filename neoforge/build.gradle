plugins {
    id 'multiloader-loader'
    id 'idea'
    id 'net.neoforged.moddev'
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Separate directory, so a dedicated server can run next to the dev client.
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Own directory: in run/ it would share the folder with the dev client.
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dependencies added to localRuntime are available in dev runs but are not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // NeoForge mods are published in Mojang names: they run in the development environment as they are, mixins included.
    implementation "maven.modrinth:farmers-delight:${farmers_delight_version}"
    implementation "com.pockyl.diegesis:neoforge:${diegesis_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    // Miner's Delight's copper pot is a station when that mod is there: mixins into it, compiled against it only.
    compileOnly "maven.modrinth:miners-delight:${miners_delight_version}"
    // Brewin' and Chewin's keg is a station too: compiled against it only.
    compileOnly "maven.modrinth:brewin-and-chewin:${brewin_and_chewin_version}"
    // Dungeons Delight's monster pot is a station too: compiled against it only.
    compileOnly "maven.modrinth:dungeons_delight:${dungeons_delight_version}"
}

// -Paddons runs the game and the game tests with the most downloaded Farmer's Delight addons that have a NeoForge 1.21.1 build
// (Modrinth version ids), so that the mod is tested with them as well as without. Delightful, Nether's Delight and Farmer's
// Respite have none.
if (providers.gradleProperty('addons').isPresent()) {
    dependencies {
        [
                'ends-delight:YTApg6Hl',          // End's Delight 2.6.1+neoforge.1.21.1
                'oceans-delight:ja5Qg1xw',        // Ocean's Delight 1.0.4
                'chefs-delight:N8hZwT7r',         // Chef's Delight 1.0.6-neoforge-1.21.1
                'enders-delight:5S67w5gs',        // Ender's Delight 1.3.1
                'my-nethers-delight:SGFJBL5q',    // My Nether's Delight 1.10.4.1
                'more-delight:DpW4EgJo',          // More Delight 26.05.20a-1.21-neoforge
                'delight-lib:wCR4QGbG',           // Delight Lib 26.05.18-1.21-neoforge, needed by More Delight
                'autochefs-delight:ENpbCFK1',     // Autochef's Delight 2.0.3+neoforge
                "brewin-and-chewin:${brewin_and_chewin_version}", // Brewin' And Chewin' 4.5.0+1.21.1-neoforge
                "miners-delight:${miners_delight_version}", // Miner's Delight 1.4.5
                'lodestonelib:CohX6yP1',          // Lodestone 1.8.2, needed by Miner's Delight
                'frights-delight:4BABsmeb',       // Fright's Delight 1.4.8: a bone cut into the skewers its kebabs are served on
                "dungeons_delight:${dungeons_delight_version}", // Dungeons Delight 1.21.1-1.5.2
                'runiclib:tk5EQpUG',              // RunicLib 5.0.7, needed by Dungeons Delight
                'choppers-delight:oulg9zE4',      // Chopper's Delight 1.2.2: cutting boards of every wood, Farmer's Delight's own block
        ].each { localRuntime "maven.modrinth:${it}" }
        // -Paddons=wide adds the next most downloaded addons that need no other mods: more food, own crafts and tags. Vintage
        // Delight, in the 1.20.1 list, has no NeoForge 1.21.1 build.
        if (providers.gradleProperty('addons').get() == 'wide') {
            [
                    'rustic-delight:sAaG4pSA',        // Rustic Delight 1.7.1
                    'ubes-delight:hxl0dMZ3',          // Ube's Delight neoforge-1.21.1-0.4.15
                    'crabbers-delight:j5Nzh8kh',      // Crabber's Delight 1.3.1
                    'cultural-delights:LYCtSz7r',     // Cultural Delights 0.19.8-1.21.1
                    'barbeques-delight-forge:rvUhMw6d', // Barbeque's Delight 1.3.0
                    'festive-delight:FP8ZwEus',       // Festive Delight 2.0.0
            ].each { localRuntime "maven.modrinth:${it}" }
        }
    }
}

// -Pkubejs runs the game tests with KubeJS and a server script listening to its recipe event, so that the board is seen to
// find its dishes when KubeJS changes the recipes.
var kubejs = providers.gradleProperty('kubejs').isPresent()
if (kubejs) {
    dependencies {
        [
                'kubejs:GDXCpKlp',                // KubeJS 2101.7.2-build.381
                'rhino:SqkDvOLG',                 // Rhino 2101.2.8-build.91, needed by KubeJS
                'better-advanced-tooltips:uPFbnD32', // Better Advanced Tooltips 2101.1.0-build.5, needed by KubeJS
                'architectury-api:1IiqEQGl',      // Architectury 13.0.11, for KubeJS
        ].each { localRuntime "maven.modrinth:${it}" }
    }
}
var prepareKubeJs = tasks.register('prepareKubeJs') {
    var script = project.file('run/gametest/kubejs/server_scripts/handson_delight_test.js')
    inputs.property('kubejs', kubejs)
    doLast {
        if (kubejs) {
            script.parentFile.mkdirs()
            script.text = 'ServerEvents.recipes(event => {})' + System.lineSeparator()
        } else {
            script.delete()
        }
    }
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { dependsOn prepareKubeJs }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
            farmers_delight_version_range: farmers_delight_version_range,
            diegesis_version_range : diegesis_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}+${minecraft_version} (NeoForge)"
    modLoaders.add('neoforge')
}
