plugins {
    id 'multiloader-loader'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            // Separate directory, so a dedicated server can run next to the dev client.
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            // Own directory, with Diegesis in its mods folder (see syncDevMods).
            gameDirectory = project.file('run/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Dependencies added to localRuntime are available in dev runs but are not published as dependencies.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

configurations {
    // Diegesis is a mod with mixins from an included build: it runs from a mods folder, as in the playtest client.
    devMods {
        canBeConsumed = false
        transitive = false
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
    }
}

dependencies {
    // Published mods use SRG names; the mod* configurations remap them to the development mappings.
    modImplementation "maven.modrinth:farmers-delight:${farmers_delight_version}"
    compileOnly "com.pockyl.diegesis:forge:${diegesis_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modCompileOnly "dev.emi:emi-forge:${emi_version}:api"
    devMods "com.pockyl.diegesis:forge:${diegesis_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// -Paddons runs the game and the game tests with the most downloaded Farmer's Delight addons (Modrinth version ids), so that the
// mod is tested with them as well as without.
if (providers.gradleProperty('addons').isPresent()) {
    dependencies {
        [
                'ends-delight:FHVQqUkN',          // End's Delight 2.6.1+forge.1.20.1
                'oceans-delight:9jLLNENb',        // Ocean's Delight 1.0.2-1.20
                'chefs-delight:2xW9d8wE',         // Chef's Delight 1.0.5-forge-1.20.1
                'enders-delight:Jaf9wxnO',        // Ender's Delight 1.1.4
                'my-nethers-delight:pOBasFQT',    // My Nether's Delight 1.20.1-1.10.4-backport.1
                'more-delight:GrLDJ8lO',          // More Delight 26.05.20-1.20-forge
                'delight-lib:1lt5savO',           // Delight Lib 26.05.18-1.20-forge, needed by More Delight
                'autochefs-delight:uqjoo6xs',     // Autochef's Delight 1.0.7+forge
                'brewin-and-chewin:9myDFPCD',     // Brewin' And Chewin' 1.20.1-3.2.1
                'miners-delight:p0INUam7',        // Miner's Delight 1.20.1-1.4.5-backport
                'delightful:HbEQIqIu',            // Delightful 3.8.1-1.20.1
                'nethers-delight:MTDQhZd2',       // Nether's Delight 1.20.1-4.0
                'farmers-respite:kucmCxP0',       // Farmer's Respite 1.20.1-2.1
                'frights-delight:r31i2Fd1',       // Fright's Delight 1.4.8: a bone cut into the skewers its kebabs are served on
        ].each { modRuntimeOnly "maven.modrinth:${it}" }
    }
}

// -Pculinary runs the game tests with Culinary Compat, which turns Pam's HarvestCraft crafts that need its cutting board into cuts of
// several things at once on Farmer's Delight's board, made at the board's station too. It does so only with Cooking for Blockheads.
if (providers.gradleProperty('culinary').isPresent()) {
    dependencies {
        [
                'culinary-compat:BjWAP4cd',                 // Culinary Compat! 1.1.0
                'cooking-for-blockheads:W87tG8sG',          // Cooking for Blockheads 16.0.15
                'balm:dDN38ae7',                            // Balm 7.3.44, needed by Cooking for Blockheads
                'pams-harvestcraft-2-food-core:RLPfpN1a',   // Pam's HarvestCraft 2: Food Core 1.0.5
        ].each { modRuntimeOnly "maven.modrinth:${it}" }
    }
}

// -Pkubejs runs the game tests with KubeJS and a server script listening to its recipe event: KubeJS for 1.20.1 then loads the
// recipes itself and cancels the game's own loading, and the board must still find its dishes (KubeJsRecipesMixin).
var kubejs = providers.gradleProperty('kubejs').isPresent()
if (kubejs) {
    dependencies {
        [
                'kubejs:hVR2xUSr',                // KubeJS 2001.6.5-build.26
                'rhino:uNALdylI',                 // Rhino 2001.2.3-build.10, needed by KubeJS
                'architectury-api:1MKTLiiG',      // Architectury 9.2.14, needed by KubeJS
        ].each { modRuntimeOnly "maven.modrinth:${it}" }
    }
}

var syncDevMods = tasks.register('syncDevMods', Sync) {
    from(configurations.devMods)
    into 'run/gametest/mods'
}

// Forge 1.20.1 runs the game tests on a dedicated server, in a world made from server.properties: a flat one.
var prepareGameTestServer = tasks.register('prepareGameTestServer') {
    var dir = project.file('run/gametest')
    inputs.property('kubejs', kubejs)
    outputs.file(new File(dir, 'server.properties'))
    doLast {
        dir.mkdirs()
        new File(dir, 'server.properties').text = [
                'level-type=minecraft:flat', 'generate-structures=false', 'spawn-protection=0'
        ].join(System.lineSeparator()) + System.lineSeparator()
        var script = new File(dir, 'kubejs/server_scripts/handson_delight_test.js')
        if (kubejs) {
            script.parentFile.mkdirs()
            script.text = 'ServerEvents.recipes(event => {})' + System.lineSeparator()
        } else {
            script.delete()
        }
    }
}
tasks.named('runGameTestServer') { dependsOn syncDevMods, prepareGameTestServer }

// Refmaps translate the mixin targets to the SRG names Forge uses at runtime.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_url                : mod_url,
            farmers_delight_version_range: farmers_delight_version_range,
            diegesis_version_range : diegesis_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    // Forge 47 reads mixin configs from the manifest, not from mods.toml.
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    // The reobfuscated (SRG) jar is the one that runs outside the development environment.
    file = tasks.named('reobfJar').flatMap { it.archiveFile }
    displayName = "${mod_name} ${mod_version}+${minecraft_version} (Forge)"
    modLoaders.add('forge')
}
